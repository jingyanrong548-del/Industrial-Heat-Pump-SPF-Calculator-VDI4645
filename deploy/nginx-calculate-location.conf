# Add inside the SPF calculator site server { } block in 宝塔/Nginx.
# Proxies Open Thermal AI POST /calculate to the local SPF API.
location = /calculate {
    proxy_pass http://127.0.0.1:9106/calculate;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_read_timeout 60s;
}

location = /calculate/health {
    proxy_pass http://127.0.0.1:9106/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
